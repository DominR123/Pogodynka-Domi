App\Entity\Location:
    properties:
        latitude:
            - Range:
                  min: -90
                  max: 90
                  notInRangeMessage: 'This value should be between {{ min }} and {{ max }}.'
        longitude:
            - Range:
                  min: -90
                  max: 90
                  notInRangeMessage: 'This value should be between {{ min }} and {{ max }}.'
